[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Shell/PowerShell installer scripts attached to each GitHub Release
installers = ["shell", "powershell"]
# Install next to cargo-installed binaries so `cargo install` and the installer agree
install-path = "CARGO_HOME"
# release-plz pushes the tag with GITHUB_TOKEN, which can't trigger tag-push workflows;
# it starts this workflow with workflow_dispatch instead.
dispatch-releases = true
