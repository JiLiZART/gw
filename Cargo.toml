[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gw-parse = { path = "crates/gw-parse" }
gw-render = { path = "crates/gw-render" }
ratatui = "0.30"
throbber-widgets-tui = "0.11"
unicode-width = "0.2"
insta = "1.49"
