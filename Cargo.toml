[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Nikolay Kostyurin"]
repository = "https://github.com/JiLiZART/gw"
homepage = "https://github.com/JiLiZART/gw"

[workspace.dependencies]
# Exact pins keep the three published crates in lockstep (see RELEASING.md).
gw-parse = { path = "crates/gw-parse", version = "=0.3.0" }
gw-render = { path = "crates/gw-render", version = "=0.3.0" }
ratatui = "0.30"
throbber-widgets-tui = "0.11"
unicode-width = "0.2"
insta = "1.49"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
